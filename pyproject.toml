[project]
name = "octopus-media-card"
version = "0.1.0"
description = "Minimal Home Assistant backend for the Octopus Media Card"
requires-python = ">=3.14.2"
license = { text = "MIT" }

[project.urls]
Homepage = "https://github.com/Kraken-Labz/octopus-media-card"
Repository = "https://github.com/Kraken-Labz/octopus-media-card"
Issues = "https://github.com/Kraken-Labz/octopus-media-card/issues"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["custom_components/octopus_media"]

[tool.coverage.report]
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]
show_missing = true

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["custom_components", "tests"]
preview = true

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "SIM", "UP"]
explicit-preview-rules = true

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
strict_equality = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
  "pytest_homeassistant_custom_component",
  "pytest_homeassistant_custom_component.*",
  "voluptuous",
  "voluptuous.*",
]
ignore_missing_imports = true
